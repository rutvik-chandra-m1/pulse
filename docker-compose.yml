services:
  server:
    build: ./server
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - JWT_ACCESS_SECRET=change_me_access
      - JWT_REFRESH_SECRET=change_me_refresh
      - DB_PATH=/app/data/pulse.db
    volumes:
      - pulse-data:/app/data

  client:
    build:
      context: ./client
      args:
        VITE_API_BASE: http://localhost:4000
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  pulse-data:
